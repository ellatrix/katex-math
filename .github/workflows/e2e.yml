name: Tests

on:
    push:
        branches: [ trunk ]
    pull_request:

jobs:
    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint:js
            - run: npm exec --no -- playwright install --with-deps chromium webkit firefox
            - run: npm run wp-env start
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: artifacts
                  path: artifacts
